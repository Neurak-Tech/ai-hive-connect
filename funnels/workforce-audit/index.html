  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5PWDMS78"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Meta Pixel (noscript) -->
    <noscript id="aihive-fbpixel-noscript"></noscript>
    <script>
      if (window.AIHIVE_META_PIXEL_ID) {
        document.getElementById("aihive-fbpixel-noscript").innerHTML =
          '<img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=' +
          encodeURIComponent(window.AIHIVE_META_PIXEL_ID) + '&ev=PageView&noscript=1" />';
      }
    </script>
    <!-- End Meta Pixel (noscript) -->

    <div id="root"></div>

    <!-- AiHive: funnel conversion tracking + CRM webhook -->
    <script>
    (function () {
      "use strict";

      // Where completed-lead data is forwarded (AiHive CRM inbound webhook).
      var WEBHOOK_URL = "https://backend.theaihive.io/api/v1/input/inbound-webhook/d42fd3018c8d394fb5d054c78a7daa246a9d62f9aa91e73837b90dc97e0755ae";
      var WEBHOOK_SECRET = "itSmvdvNiLiw8aty";

      window.dataLayer = window.dataLayer || [];

      function val(id) {
        var el = document.getElementById(id);
        if (!el) return "";
        if (el.type === "checkbox") return !!el.checked;
        return (el.value || "").trim();
      }

      // Field values captured at submit time. React unmounts each step as soon as it is
      // accepted, so reading the DOM after the submit would find the fields already gone.
      var FIELD_IDS = [
        "firstName", "email", "phone", "whatsappConsent", "followupConsent", "industry",
        "otherTool", "context", "timeline",
        "b-firstName", "b-lastName", "b-email", "b-phone", "b-company", "b-website"
      ];
      var captured = {};

      function captureFields() {
        FIELD_IDS.forEach(function (id) {
          if (document.getElementById(id)) captured[id] = val(id);
        });
        // The country-code <select> has no id, only an aria-label.
        var cc = document.querySelector('select[aria-label="Phone country code"]');
        if (cc) captured.country = cc.value;
      }

      function field(id) {
        return captured[id] === undefined ? "" : captured[id];
      }

      // Mirrors the app's own Step 1 validation, so Lead only fires when the step is accepted.
      function step1Valid() {
        var phone = field("phone").replace(/\D/g, "");
        var cc = field("country");
        if (!field("firstName")) return false;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(field("email"))) return false;
        if (phone.length < 6 || (cc.replace(/\D/g, "") + phone).length > 15) return false;
        if (cc === "+91" && !/^[6-9]\d{9}$/.test(phone)) return false;
        return true;
      }

      function sha256(text) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
          return Array.prototype.map.call(new Uint8Array(buf), function (b) {
            return ("0" + b.toString(16)).slice(-2);
          }).join("");
        });
      }

      // Hashed user data in the Google tag format (sha256_* keys), normalised first:
      // email and name lower-cased and trimmed, phone in E.164 (+<country code><number>).
      function hashedUserData(firstName, email, cc, phone) {
        if (!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.resolve(null);
        var e164 = "+" + cc.replace(/\D/g, "") + phone.replace(/\D/g, "").replace(/^0+/, "");
        return Promise.all([
          sha256(email.trim().toLowerCase()),
          sha256(e164),
          sha256(firstName.trim().toLowerCase())
        ]).then(function (h) {
          return {
            sha256_email_address: h[0],
            sha256_phone_number: h[1],
            address: { sha256_first_name: h[2] }
          };
        }).catch(function () {
          return null;
        });
      }

      // Picked up in GTM by the Meta CAPI tag (custom event "aihive_meta"), which sends
      // the server copy of a browser event with the same event_id.
      function pushMetaServerEvent(eventName, eventId, userData) {
        var payload = { event: "aihive_meta", meta_event_name: eventName, meta_event_id: eventId };
        if (userData) payload.user_data = userData;
        if (window.AIHIVE_META_TEST_EVENT_CODE) payload.test_event_code = window.AIHIVE_META_TEST_EVENT_CODE;
        window.dataLayer.push(payload);
      }

      if (window.AIHIVE_PAGEVIEW_EVENT_ID) {
        pushMetaServerEvent("PageView", window.AIHIVE_PAGEVIEW_EVENT_ID);
      }

      function readStep1() {
        return {
          firstName: field("firstName"),
          email: field("email"),
          country: field("country"),
          phone: field("phone"),
          whatsappConsent: field("whatsappConsent"),
          followupConsent: field("followupConsent"),
          industry: field("industry"),
          otherTool: field("otherTool"),
          context: field("context"),
          timeline: field("timeline")
        };
      }

      function readStep2() {
        return {
          firstName: field("b-firstName"),
          lastName: field("b-lastName"),
          email: field("b-email"),
          phone: field("b-phone"),
          company: field("b-company"),
          website: field("b-website")
        };
      }

      function mergedLead(extra) {
        var lead = {};
        var s1 = readStep1();
        var s2 = readStep2();
        for (var k in s1) if (s1[k]) lead[k] = s1[k];
        for (var k2 in s2) if (s2[k2]) lead[k2] = s2[k2];
        lead.page_url = window.location.href;
        lead.page_title = document.title;
        lead.timestamp = new Date().toISOString();
        if (extra) for (var k3 in extra) lead[k3] = extra[k3];
        return lead;
      }

      function pushDataLayer(event, payload) {
        window.dataLayer.push(Object.assign({ event: event }, payload));
      }

      function trackMetaPixel(eventName, payload) {
        if (typeof window.fbq === "function") {
          window.fbq("track", eventName, payload || {});
        }
      }

      function sendWebhook(lead) {
        try {
          fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Webhook-Secret": WEBHOOK_SECRET
            },
            body: JSON.stringify({
              source: "ai-workforce-audit-funnel",
              event: lead.conversion_event || "lead",
              lead: lead
            }),
            keepalive: true
          }).catch(function (err) {
            console.error("AiHive webhook forward failed:", err);
          });
        } catch (err) {
          console.error("AiHive webhook forward error:", err);
        }
      }

      var firedStep1 = false;
      var firedBooking = false;

      // Step 1: initial audit request form ("Get my free audit" style submit).
      document.addEventListener(
        "submit",
        function (e) {
          var form = e.target;
          if (!(form instanceof HTMLFormElement)) return;
          captureFields();

          if (form.querySelector("#email") && form.querySelector("#firstName") && !firedStep1) {
            setTimeout(function () {
              if (!step1Valid()) return; // validation blocked the submit; do not fire
              firedStep1 = true;
              var eventId = window.aihiveEventId("lead");
              var lead = mergedLead({
                conversion_event: "audit_request_started",
                meta_event_id: eventId,
                test_event_code: window.AIHIVE_META_TEST_EVENT_CODE || undefined
              });
              pushDataLayer("aihive_lead_step1", { lead: lead });
              // Standard Lead event, deduplicated against the CAPI copy by eventID.
              if (typeof window.fbq === "function") {
                window.fbq("track", "Lead", {}, { eventID: eventId });
              }
              hashedUserData(field("firstName"), field("email"), field("country"), field("phone")).then(function (userData) {
                pushMetaServerEvent("Lead", eventId, userData);
              });
              sendWebhook(lead);
            }, 0);
          }

          if (form.querySelector("#b-email") && form.querySelector("#b-company")) {
            setTimeout(function () {
              var email = field("b-email");
              var company = field("b-company");
              if (!email || !company) return; // validation blocked the submit
              var lead = mergedLead({ conversion_event: "booking_details_submitted" });
              pushDataLayer("aihive_lead_details", { lead: lead });
              trackMetaPixel("CompleteRegistration", { content_name: "booking_details_submitted" });
              sendWebhook(lead);
            }, 0);
          }
        },
        true
      );

      // Final step: user picks a slot and clicks "Confirm <slot>" — the true booking conversion.
      document.addEventListener(
        "click",
        function (e) {
          if (firedBooking) return;
          var btn = e.target.closest && e.target.closest("button");
          if (!btn || btn.disabled) return;
          var text = (btn.textContent || "").trim();
          if (!/^Confirm\s/.test(text)) return;
          if (!/\d{1,2}(:\d{2})?\s?(AM|PM|am|pm)?/.test(text) && !/·/.test(text)) return;

          firedBooking = true;
          setTimeout(function () {
            var lead = mergedLead({ conversion_event: "audit_booking_confirmed", slot_label: text });
            pushDataLayer("aihive_booking_confirmed", { lead: lead });
            trackMetaPixel("Schedule", { content_name: "audit_booking_confirmed" });
            sendWebhook(lead);
          }, 0);
        },
        true
      );
    })();
    </script>
