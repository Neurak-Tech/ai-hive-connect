name: Deploy funnels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate funnels
        run: node scripts/build-site.js --check

      - name: Assemble site
        run: node scripts/build-site.js

      - name: Confirm published paths
        run: |
          set -euo pipefail
          test -s _site/CNAME
          test -f _site/.nojekyll
          node -e '
            const fs = require("fs");
            const site = JSON.parse(fs.readFileSync("site.json", "utf8"));
            for (const funnel of site.funnels) {
              if (funnel.publish !== true) continue;
              const file = `_site/${funnel.slug}/index.html`;
              if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
                throw new Error("missing " + file);
              }
              console.log("artifact " + file);
            }
          '
          echo "Artifact paths:"
          find _site -type f | sort

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
